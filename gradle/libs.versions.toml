[plugins]
versions = { id = "com.github.ben-manes.versions", version = "0.51.0" }

[versions]
# Plugins
minotaur = "2.+"
blossom = "2.1.0"
loom = "1.6-SNAPSHOT"
architectury-plugin = "3.4-SNAPSHOT"
licenser = "0.6.1"
shadow = "8.1.1"
idea-ext = "1.1.7"
indra = "3.1.3"

neo-moddev = "1.0.11"

# Languages
kotlin = "1.7.10"

# Game Level Dependencies
minecraft = "1.21"
fabric-api = "0.100.8"
fabric-loader = "0.16.0"

# Integration
guice = "7.0.0"
guava = "32.1.2-jre"
gson = "2.10.1"
auto-service = "1.1.1"
checker = "3.42.0"
checker-qual = "3.42.0"
maven-artifacts = "3.9.6"
jetbrains-annotations = "26.0.1"

# Adventure
adventure = "4.18.0"
adventure-ansi = "1.1.1"
adventure-platform = "4.3.3"

# Cloud
cloud = "2.0.0-beta.9"
cloud-annotations = "2.0.0-rc.2"
cloud-processors = "1.0.0-beta.3"

# Networking
jedis = "5.1.3"

# Storage Drivers
hikari = "5.1.0"
h2 = "2.3.230"
sqlite = "3.46.1.3"
mysql = "9.1.0"
mariadb = "3.4.1"
postgresql = "42.7.4"

# Storage Tools
flyway = "11.2.0"

# UI
gooeylibs = "3.1.0-1.21.1-SNAPSHOT"

# Utility
caffeine = "3.1.8"
configurate = "4.1.2"
sponge-math = "2.0.1"
jar-relocator = "1.7"
sponge-event-gen = "8.0.0"
spark = "0.1-SNAPSHOT"

# Mixins
mixin = "0.13.4+mixin.0.8.5"
mixinExtras = "0.4.1"

# Unit Testing
junit = "5.10.3"
log4j = "2.22.1"
mockito = "5.12.0"

[libraries]
# Minecraft
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }

# Adventure / Kyori
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-key = { group = "net.kyori", name = "adventure-key", version.ref = "adventure" }
adventure-nbt = { group = "net.kyori", name = "adventure-nbt", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-serializers-legacy = { group = "net.kyori", name = "adventure-text-serializer-gson", version.ref = "adventure" }
adventure-serializers-gson = { group = "net.kyori", name = "adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-serializers-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
adventure-serializers-ansi = { group = "net.kyori", name = "adventure-text-serializer-ansi", version.ref = "adventure-ansi" }
adventure-platform-api = { group = "net.kyori", name = "adventure-platform-api", version.ref = "adventure-platform" }

# Cloud
cloud-core = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud-annotations" }
cloud-brigadier = { group = "org.incendo", name = "cloud-brigadier", version.ref = "cloud" }
cloud-confirmations = { group = "org.incendo", name = "cloud-processors-confirmation", version.ref = "cloud-processors" }

cloud-minecraftExtras = { group = "org.incendo", name = "cloud-minecraft-extras", version.ref = "cloud" }
cloud-fabric = { group = "org.incendo", name = "cloud-fabric", version.ref = "cloud" }

# Integration
google-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
google-guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
google-auto-service = { group = "com.google.auto.service", name = "auto-service", version.ref = "auto-service" }
checker-base = { group = "org.checkerframework", name = "checker", version.ref = "checker" }
checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checker-qual" }
maven-artifacts = { group = "org.apache.maven", name = "maven-artifact", version.ref = "maven-artifacts" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }

# Build Logic
kotlin-jvm = { group = "org.jetbrains.kotlin.jvm", name = "org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
indra = { group = "net.kyori", name = "indra-common", version.ref = "indra" }
loom = { group = "dev.architectury", name = "architectury-loom", version.ref = "loom" }
architectury = { group = "architectury-plugin", name = "architectury-plugin.gradle.plugin", version.ref = "architectury-plugin" }
shadow = { group = "com.github.johnrengelman", name = "shadow", version.ref = "shadow" }
minotaur = { group = "com.modrinth.minotaur", name = "Minotaur", version.ref = "minotaur" }
blossom = { group = "net.kyori", name = "blossom", version.ref = "blossom" }
idea-ext = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext" }
licenser = { group = "gradle.plugin.org.cadixdev.gradle", name = "licenser", version.ref = "licenser" }
neo-moddev = { group = "net.neoforged", name = "moddev-gradle", version.ref = "neo-moddev" }

# Networking
networking-jedis = { group = "redis.clients", name = "jedis", version.ref = "jedis" }

# Storage Drivers
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
mysql = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }
mariadb = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
h2 = { group = "com.h2database", name = "h2", version.ref = "h2" }

# Storage Tools
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }

# UI
gooeylibs = { group = "ca.landonjw.gooeylibs", name = "api", version.ref = "gooeylibs" }

# Mixins
mixins-base = { group = "net.fabricmc", name = "sponge-mixin", version.ref = "mixin" }
mixins-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }

# Utilities
caffeine-core = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
caffeine-extensions-guava = { group = "com.github.ben-manes.caffeine", name = "guava", version.ref = "caffeine" }
sponge-math = { group = "org.spongepowered", name = "math", version.ref = "sponge-math" }
lucko-relocator = { group = "me.lucko", name = "jar-relocator", version.ref = "jar-relocator" }
sponge-events-processor = { group = "org.spongepowered", name = "event-impl-gen", version.ref = "sponge-event-gen" }
sponge-events-annotations = { group = "org.spongepowered", name = "event-impl-gen-annotations", version.ref = "sponge-event-gen" }
spark = { group = "me.lucko", name = "spark-api", version.ref = "spark" }

# Configurate
configurate-core = { group = "org.spongepowered", name = "configurate-core", version.ref = "configurate" }
configurate-gson = { group = "org.spongepowered", name = "configurate-gson", version.ref = "configurate" }
configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
configurate-yaml = { group = "org.spongepowered", name = "configurate-yaml", version.ref = "configurate" }

# Unit Testing
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-parameters = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }

[bundles]
configurate = ["configurate-core", "configurate-gson", "configurate-hocon", "configurate-yaml"]
blossom = ["blossom", "idea-ext"]
adventure = ["adventure-api", "adventure-key", "adventure-nbt", "adventure-minimessage"]
cloud-base = ["cloud-core", "cloud-annotations", "cloud-brigadier", "cloud-confirmations"]
cloud-fabric = ["cloud-minecraftExtras", "cloud-fabric"]
log4j = ["log4j-api", "log4j-core"]
mixins = ["mixins-base", "mixins-extras"]